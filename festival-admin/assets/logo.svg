<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 108" role="img" aria-label="Islamiska Förbundet · Stockholms Moské">
  <title>Islamiska Förbundet · Stockholms Moské</title>
  <!--
    SVG-tolkning av föreningens märke: mihrab-båge med IF-monogram.
    Färg: föreningens brass-guld #b8a866 (hårdkodad — speglar inte
    sidans designsystem-brass utan brandfärgen). Ersätt gärna med
    den officiella vektorfilen (samma sökväg).
  -->
  <g fill="#b8a866">
    <!-- Mihrab-arch frame (yttre kontur + inre cutout i samma sub-path) -->
    <path d="
      M 10 104
      L 10 44
      C 10 20 27 8 50 8
      C 73 8 90 20 90 44
      L 90 104
      L 76 104
      L 76 48
      C 76 31 64 22 50 22
      C 36 22 24 31 24 48
      L 24 104
      Z
    "/>
    <!-- I bokstav -->
    <rect x="31" y="40" width="9" height="50" rx="4.5"/>
    <!-- F bokstav: vertikal + topp + mitt -->
    <rect x="49" y="40" width="9" height="50" rx="4.5"/>
    <rect x="49" y="40" width="22" height="9" rx="4.5"/>
    <rect x="49" y="56" width="17" height="9" rx="4.5"/>
  </g>
</svg>
